networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:

services:
  # ─── 1. PostgreSQL Database (Product & Auth Services) ────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: products_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d products_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. MongoDB Database (Order Service) ─────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: orders_db
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Redis Cache Service (Dùng cho Product Caching - Yêu cầu 4) 
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 4. Auth Service (PostgreSQL + Prisma + JWT) ──────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: development
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://admin:secret@postgres:5432/products_db?schema=auth
      JWT_SECRET: super_secret_jwt_key_at_least_32_characters_long_12345
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super_secret_refresh_jwt_key_at_least_32_characters_long_67890
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  # ─── 5. Product Service (PostgreSQL + Prisma + Redis + Cloudinary) 
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: development
      SERVICE_NAME: product-service
      DATABASE_URL: postgresql://admin:secret@postgres:5432/products_db?schema=public
      REDIS_URL: redis://redis:6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-123456789}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-abcdefghijklmnopqrstuvwxyz}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservices-net

  # ─── 5. Order Service (MongoDB + Mongoose) ─────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_service
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: development
      SERVICE_NAME: order-service
      MONGODB_URI: mongodb://admin:secret@mongo:27017/orders_db?authSource=admin
      PRODUCT_SERVICE_URL: http://product-service:3001
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - microservices-net

  # ─── 6. API Gateway (Reverse Proxy + Auth + Rate Limiter) ─────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      PRODUCT_SERVICE_URL: http://product-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      AUTH_SERVICE_URL: http://auth-service:3003
      JWT_SECRET: super_secret_jwt_key_at_least_32_characters_long_12345
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - microservices-net
